name: Preview Deploy

on:
  push:
    branches:
    - "**"

jobs:
  deploy-preview:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy preview environment
        run: |
          chmod +x scripts/deploy-preview.sh
          ./scripts/deploy-preview.sh "${{ github.ref_name }}"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace("refs/heads/", "");
            const apiurl = `https://${branch}.clustergit.com`;
            const uiurl = `https://${branch}.clustergit.pages.dev`;
            
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`
            });
            
            if (prs.data.length > 0) {
              const pr = prs.data[0];
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: ` Preview environment ready\n\nBranch: **${branch}**\n\nUI URL:\n${uiurl} \nAPI URL:\n${apiurl}` }); }