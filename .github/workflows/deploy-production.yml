name: Deploy Production

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Apply storage manifests
        run: |
          kubectl apply -f k8s/storage-deployment.yaml
          kubectl apply -f k8s/storage-ingress.yaml
          kubectl apply -f k8s/node-sync-cronjob.yaml

      - name: Update and restart storage deployment
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]')
          kubectl set image deployment/clustergit-backend \
            backend=ghcr.io/laurenislearning/clustergit-backend:$BRANCH \
            -n storage
          kubectl set image cronjob/clustergit-node-sync \
            node-sync=ghcr.io/laurenislearning/clustergit-backend:$BRANCH \
            -n storage
          kubectl rollout status deployment/clustergit-backend -n storage
