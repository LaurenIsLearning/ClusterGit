name: Build Backend Image

on:
  push:
    branches:
        - "**"
    paths:
        - 'backend/**'
        - '.github/workflows/backend-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set branch tag
        id : vars
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "tag=$BRANCH" >> $GITHUB_OUTPUT

      - name: Set lowercase owner
        id: owner
        run: |
          echo "name=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        run: |
          docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t ghcr.io/${{ steps.owner.outputs.name }}/clustergit-backend:${{ steps.vars.outputs.tag }} \
            -t ghcr.io/${{ steps.owner.outputs.name }}/clustergit-backend:latest \
          --push \
          ./backend

      - name: Deploy to Kubernetes
        run: |
          kubectl config set-cluster k3s --server=${{ secrets.KUBE_SERVER }} --insecure-skip-tls-verify=true
          kubectl config set-credentials deployer --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context default --cluster=k3s --user=deployer --namespace=${{ secrets.KUBE_NAMESPACE }}
          kubectl config use-context default
          
          kubectl rollout restart deployment clustergit-backend