name: Build Backend Image

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"

jobs:
  build:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set branch tag
        id: vars
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SAFE_BRANCH=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
          echo "tag=$SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Set lowercase owner
        id: owner
        run: |
          echo "name=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ghcr.io/${{ steps.owner.outputs.name }}/clustergit-backend:${{ steps.vars.outputs.tag }} \
            -t ghcr.io/${{ steps.owner.outputs.name }}/clustergit-backend:latest \
            --push \
            ./backend

      - name: Deploy branch backend to Kubernetes
        run: |
          BRANCH=${{ steps.vars.outputs.tag }}

          export KUBECONFIG=/tmp/kubeconfig

          kubectl config set-cluster k3s --server=${{ secrets.KUBE_SERVER }} --insecure-skip-tls-verify=true
          kubectl config set-credentials deployer --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context default --cluster=k3s --user=deployer
          kubectl config use-context default

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: clustergit-backend-$BRANCH
            namespace: storage
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: clustergit-backend-$BRANCH
            template:
              metadata:
                labels:
                  app: clustergit-backend-$BRANCH
              spec:
                containers:
                - name: backend
                  image: ghcr.io/${{ steps.owner.outputs.name }}/clustergit-backend:$BRANCH
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 80
                  envFrom:
                  - secretRef:
                      name: clustergit-backend-env
                  volumeMounts:
                  - mountPath: /git-repos
                    name: repo-volume
                volumes:
                - name: repo-volume
                  persistentVolumeClaim:
                    claimName: repo-vol-rwo-pvc
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: clustergit-backend-$BRANCH
            namespace: storage
          spec:
            selector:
              app: clustergit-backend-$BRANCH
            ports:
            - port: 80
              targetPort: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: clustergit-backend-$BRANCH
            namespace: storage
          spec:
            ingressClassName: traefik
            rules:
            - host: $BRANCH.api.clustergit.com
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: clustergit-backend-$BRANCH
                      port:
                        number: 80
          EOF