name: Build Backend Base Image

permissions:
  contents: read
  packages: write

on:
  push:
    paths:
      - "backend/Dockerfile.base"
      - ".github/workflows/backend-base.yml"

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build base image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ghcr.io/laurenislearning/clustergit-backend:${{ github.ref_name }} \
            --push \
            .