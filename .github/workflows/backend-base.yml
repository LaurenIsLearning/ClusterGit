name: Build Backend Base Image

on:
  push:
    paths:
      - "backend/Dockerfile.base"

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build base image
        run: |
          docker buildx build \
            -t ghcr.io/${{ github.repository_owner }}/clustergit-backend-base:latest \
            -f backend/Dockerfile.base \
            --push \
            .