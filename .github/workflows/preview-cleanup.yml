name: Preview Cleanup

on:
delete:

jobs:
cleanup-preview:
runs-on: self-hosted

steps:
  - name: Compute branch name
    id: branch
    run: |
      BRANCH=$(echo "${{ github.event.ref }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
      echo "branch=$BRANCH" >> $GITHUB_OUTPUT

  - name: Delete preview namespace
    run: |
      echo "Deleting preview namespace: preview-${{ steps.branch.outputs.branch }}"
      kubectl delete namespace preview-${{ steps.branch.outputs.branch }} --ignore-not-found